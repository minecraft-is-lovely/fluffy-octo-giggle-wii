name: Build Wii Homebrew

on:
  push:
    paths:
      - "wii-homebrew/**"
      - ".github/workflows/build-wii.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # devkitpro/wii includes devkitPPC compiler + libogc + Wii libraries
    container: devkitpro/wii:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build boot.dol
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITPPC: /opt/devkitpro/devkitPPC
        run: |
          export PATH=$DEVKITPPC/bin:$PATH
          cd wii-homebrew
          make

      - name: Upload boot.dol
        uses: actions/upload-artifact@v4
        with:
          name: hello-wii
          path: |
            wii-homebrew/boot.dol
            wii-homebrew/boot.elf
            wii-homebrew/meta.xml
          if-no-files-found: error
