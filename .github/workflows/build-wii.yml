name: Build Wii Homebrew

on:
  push:
    paths:
      - "wii-homebrew/**"
      - "wii-homebrew-scratchii/**"
      - "wii-homebrew-flipnote/**"
      - "wii-homebrew-atakeover/**"
      - "wii-homebrew-linetakeover/**"
      - "scripts/make_wad.py"
      - ".github/workflows/build-wii.yml"
  workflow_dispatch:

jobs:
  build-cubiis:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build CubiisOnline
        run: |
          source /etc/profile.d/devkit-env.sh
          cd wii-homebrew
          make

      - name: Pack WAD
        run: |
          python3 scripts/make_wad.py CUBO "CubiisOnline" wii-homebrew/boot.dol wii-homebrew/CubiisOnline.wad

      - name: Upload CubiisOnline
        uses: actions/upload-artifact@v4
        with:
          name: cubiis-online
          path: |
            wii-homebrew/boot.dol
            wii-homebrew/boot.elf
            wii-homebrew/meta.xml
            wii-homebrew/CubiisOnline.wad
          if-no-files-found: error

  build-scratchii:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Scratchii
        run: |
          source /etc/profile.d/devkit-env.sh
          cd wii-homebrew-scratchii
          make

      - name: Pack WAD
        run: |
          python3 scripts/make_wad.py SCRA "Scratchii" wii-homebrew-scratchii/boot.dol wii-homebrew-scratchii/Scratchii.wad

      - name: Upload Scratchii
        uses: actions/upload-artifact@v4
        with:
          name: scratchii
          path: |
            wii-homebrew-scratchii/boot.dol
            wii-homebrew-scratchii/boot.elf
            wii-homebrew-scratchii/meta.xml
            wii-homebrew-scratchii/Scratchii.wad
          if-no-files-found: error

  build-flipnote:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Flipnote Studio Wii
        run: |
          source /etc/profile.d/devkit-env.sh
          cd wii-homebrew-flipnote
          make

      - name: Pack WAD
        run: |
          python3 scripts/make_wad.py FLIP "Flipnote Studio Wii" wii-homebrew-flipnote/boot.dol wii-homebrew-flipnote/FlipnoteStudio.wad

      - name: Upload Flipnote Studio Wii
        uses: actions/upload-artifact@v4
        with:
          name: flipnote-studio-wii
          path: |
            wii-homebrew-flipnote/boot.dol
            wii-homebrew-flipnote/boot.elf
            wii-homebrew-flipnote/meta.xml
            wii-homebrew-flipnote/FlipnoteStudio.wad
          if-no-files-found: error

  build-atakeover:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build A Takeover
        run: |
          source /etc/profile.d/devkit-env.sh
          cd wii-homebrew-atakeover
          make

      - name: Pack WAD
        run: |
          python3 scripts/make_wad.py ATKO "A Takeover" wii-homebrew-atakeover/boot.dol wii-homebrew-atakeover/ATakeover.wad

      - name: Upload A Takeover
        uses: actions/upload-artifact@v4
        with:
          name: a-takeover
          path: |
            wii-homebrew-atakeover/boot.dol
            wii-homebrew-atakeover/boot.elf
            wii-homebrew-atakeover/meta.xml
            wii-homebrew-atakeover/ATakeover.wad
          if-no-files-found: error

  build-linetakeover:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Line Takeover
        run: |
          source /etc/profile.d/devkit-env.sh
          cd wii-homebrew-linetakeover
          make

      - name: Pack WAD
        run: |
          python3 scripts/make_wad.py LINE "Line Takeover" wii-homebrew-linetakeover/boot.dol wii-homebrew-linetakeover/LineTakeover.wad

      - name: Upload Line Takeover
        uses: actions/upload-artifact@v4
        with:
          name: line-takeover
          path: |
            wii-homebrew-linetakeover/boot.dol
            wii-homebrew-linetakeover/boot.elf
            wii-homebrew-linetakeover/meta.xml
            wii-homebrew-linetakeover/LineTakeover.wad
          if-no-files-found: error
